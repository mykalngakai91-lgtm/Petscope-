name: build-pkg
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Open Orbis Toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: bash build.sh
      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: petscope-pkg
          path: "*.pkg"
