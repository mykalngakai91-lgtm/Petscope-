name: Build PS4 PKG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build script in Open Orbis Docker
        run: |
          chmod +x ./build.sh
          docker run --rm -v "${PWD}:/workspace" -w /workspace openorbisofficial/toolchain:v0.5.1 ./build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: petscope-eboot
          path: eboot.bin
